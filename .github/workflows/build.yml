name: Build

on:
  push:
    branches: [main, 'dev-*']
    tags: ['*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: --win msi --x64
          - os: macos-14
            dist: --mac dmg --arm64
          - os: macos-15-intel
            dist: --mac dmg --x64
          - os: ubuntu-latest
            dist: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Native and per-platform packages (node-pty, CodeGraph) install for the runner's own OS and arch,
      # so each installer is built on a matching runner.
      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.msi
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

      # A tag's installers go onto its GitHub release (made by the release process) for the in-app updater.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" dist/*.msi dist/*.dmg dist/*.AppImage dist/*.deb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
