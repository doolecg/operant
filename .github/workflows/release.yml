# Push a version tag (plain, like 1.2.1) to build the installers for Windows (MSI), macOS (DMG for Apple
# Silicon and Intel) and Linux (AppImage, .deb, .rpm and .tar.gz), then publish them together as one GitHub release, with
# the top section of RELEASE_NOTES.md as its body. Installed copies pick it up via updater.js.
# Run it by hand (workflow_dispatch) to build and smoke-test every installer without publishing: they're
# attached to the run as artifacts.
name: release

on:
  push:
    tags: ['[0-9]*', 'v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json and the release notes
        if: github.ref_type == 'tag'
        run: |
          v="$(node -p "require('./package.json').version")"
          tag="$GITHUB_REF_NAME"
          if [ "$tag" != "$v" ] && [ "$tag" != "v$v" ]; then
            echo "Tag $tag doesn't match package.json ($v)"; exit 1
          fi
          # Release body: everything above the first '---' line of RELEASE_NOTES.md, which must be this version's section.
          if ! head -1 RELEASE_NOTES.md | tr -d '\r' | grep -qx "# Operant $v"; then
            echo "RELEASE_NOTES.md must start with '# Operant $v'"; exit 1
          fi

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.msi
          if-no-files-found: error

  mac:
    needs: check
    runs-on: macos-latest # Apple Silicon; the Intel app is built here too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # npm installs the terminal library only for this runner's chip; the Intel app needs the other one.
      - run: npm install --no-save --force "@lydell/node-pty-darwin-x64@$(node -p "require('@lydell/node-pty/package.json').version")"
      - run: npm run dist:mac
      - name: Each app has its chip's terminal library
        run: |
          file dist/mac-arm64/Operant.app/Contents/Resources/app.asar.unpacked/node_modules/@lydell/node-pty-darwin-arm64/prebuilds/darwin-arm64/pty.node | grep -q arm64
          file dist/mac/Operant.app/Contents/Resources/app.asar.unpacked/node_modules/@lydell/node-pty-darwin-x64/prebuilds/darwin-x64/pty.node | grep -q x86_64
      - name: Smoke test
        run: node test/smoke.mjs dist/mac-arm64/Operant.app/Contents/MacOS/Operant
        env:
          SMOKE_SHELL: /bin/zsh # macOS's default shell, whatever the runner's is
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The .rpm target shells out to rpmbuild.
      - run: sudo apt-get install -y rpm
      - run: npm run dist:linux
      # The .deb the way a user gets it: apt resolves its dependencies and it brings the sandbox's AppArmor profile.
      - run: sudo apt-get install -y ./dist/*.deb
      - name: Smoke test
        run: xvfb-run -a node test/smoke.mjs /opt/Operant/operant
      # The AppImage too, with the FUSE 2 library it needs (Ubuntu leaves it out).
      - name: Smoke test the AppImage
        run: |
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
          chmod +x dist/*.AppImage
          xvfb-run -a node test/smoke.mjs dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [windows, mac, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(node -p "require('./package.json').version")"
          tag="$GITHUB_REF_NAME"
          awk '/^---[[:space:]]*$/ { exit } { print }' RELEASE_NOTES.md > notes.md
          # SHA256SUMS for people checking a download by hand. GitHub also computes a sha256 digest for every
          # uploaded asset by itself, which is what updater.js verifies, so keep uploading the files as they are.
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Operant $v" --notes-file notes.md --latest
          fi
