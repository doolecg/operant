appId: com.doolecg.operant2
productName: Operant 3
copyright: Copyright © 2026 doolecg
directories:
  output: dist
  buildResources: build

files:
  # Only what the app loads: the main and preload bundles and the renderer. The CLI ships through
  # extraResources; demo and e2e screenshots and source maps stay out of the installer.
  - out/main/*.cjs
  - out/renderer/**
  - package.json
  - "!**/*.map"
  # CodeGraph's platform bundle is copied by build/after-pack.cjs instead (its own Node runtime is left
  # out: the embedded library runs on Electron's Node).
  - "!node_modules/@colbymchenry/codegraph-*/**"

extraResources:
  # The operant skill plugin that operators load with --plugin-dir.
  - from: plugin
    to: plugin
  # The agents' `operant` CLI and its wrappers, run with the app binary as Node.
  - from: out/cli
    to: cli
  - from: cli/bin
    to: cli
  # The window and taskbar icon, loaded at runtime.
  - from: build/icon.png
    to: icon.png
  # The PowerShell helper for the Windows media controls; outside the asar so PowerShell can read it.
  - from: helper
    to: helper

# Native modules must be real files on disk.
asarUnpack:
  - node_modules/@lydell/node-pty*/**

npmRebuild: false

# Copies CodeGraph's platform library (with its grammars) into resources/codegraph/lib.
afterPack: build/after-pack.cjs

win:
  target:
    - target: msi
      arch: [x64]
  artifactName: Operant3-${version}-windows-${arch}.${ext}

msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Operant 3

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  artifactName: Operant3-${version}-mac-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  maintainer: doolecg <doolecg@gmail.com>
  artifactName: Operant3-${version}-linux-${arch}.${ext}

publish: null
